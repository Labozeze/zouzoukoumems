name: Deploy

# A chaque push sur main : publication des fichiers du site
# sur la branche "deploy" (suivie par Hostinger).
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Publier le site sur la branche deploy
        run: |
          mkdir site
          rsync -a --exclude .git --exclude .github --exclude .gitignore --exclude site ./ site/
          cd site
          git init -q -b deploy
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Deploy ${GITHUB_SHA::7}"
          git push --force "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${GITHUB_REPOSITORY}.git" deploy
